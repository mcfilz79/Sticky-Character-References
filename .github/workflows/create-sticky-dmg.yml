
name: Create Sticky DMG Sprite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-sprite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert SVG to DMG palette
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("sticky_original_64x64.svg")
          target = Path("sticky_DMG_64x64.svg")

          if not source.exists():
              raise SystemExit("Original SVG not found.")

          svg = source.read_text(encoding="utf-8")

          colors = {
              "rgb(202,220,159)": "#E0F8D0",
              "rgb(139,172,15)": "#88C070",
              "rgb(48,98,48)": "#346856",
              "rgb(13,56,0)": "#081820",
          }

          for old, new in colors.items():
              svg = svg.replace(old, new)

          rect_count = len(re.findall(r"<rect\b", svg))
          if rect_count != 4096:
              raise SystemExit(f"Unexpected pixel count: {rect_count}")

          for color in colors.values():
              if color not in svg:
                  raise SystemExit(f"Missing target color: {color}")

          if re.search(r'rgb\(', svg):
              raise SystemExit("Unexpected remaining RGB color.")

          if not svg.lstrip().startswith("<svg"):
              raise SystemExit("Invalid SVG start.")

          target.write_text(svg, encoding="utf-8")
          print(f"Created {target} with {rect_count} pixel rectangles.")
          PY

      - name: Commit converted SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sticky_DMG_64x64.svg
          git commit -m "Create Sticky DMG palette SVG" || echo "No changes to commit"
          git push

