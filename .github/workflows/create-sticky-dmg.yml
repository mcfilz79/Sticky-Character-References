
name: Create Sticky DMG Sprite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-sprite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert SVG and remove background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import deque
          import re

          source = Path("sticky_original_64x64.svg")
          target = Path("sticky_DMG_64x64.svg")

          svg = source.read_text(encoding="utf-8")

          colors = {
              "rgb(202,220,159)": "#E0F8D0",
              "rgb(139,172,15)": "#88C070",
              "rgb(48,98,48)": "#346856",
              "rgb(13,56,0)": "#081820",
          }

          for old, new in colors.items():
              svg = svg.replace(old, new)

          groups = list(re.finditer(
              r'<g fill="([^"]+)">([\s\S]*?)</g>', svg
          ))

          pixels = {}
          for group in groups:
              color = group.group(1)
              for m in re.finditer(
                  r'<rect x="(\d+)" y="(\d+)" width="1" height="1"/>',
                  group.group(2)
              ):
                  pixels[(int(m.group(1)), int(m.group(2)))] = color

          if len(pixels) != 4096:
              raise SystemExit("Unexpected source pixel count.")

          background = "#E0F8D0"
          queue = deque()

          for x in range(64):
              queue.append((x, 0))
              queue.append((x, 63))
          for y in range(1, 63):
              queue.append((0, y))
              queue.append((63, y))

          remove = set()
          while queue:
              x, y = queue.popleft()
              if not (0 <= x < 64 and 0 <= y < 64):
                  continue
              if (x, y) in remove or pixels.get((x, y)) != background:
                  continue
              remove.add((x, y))
              queue.extend([
                  (x + 1, y), (x - 1, y),
                  (x, y + 1), (x, y - 1)
              ])

          def clean_group(match):
              color = match.group(1)
              content = match.group(2)

              def keep_pixel(rect):
                  x, y = map(int, rect.group(1, 2))
                  if (x, y) in remove:
                      return ""
                  return rect.group(0)

              content = re.sub(
                  r'<rect x="(\d+)" y="(\d+)" width="1" height="1"/>',
                  keep_pixel,
                  content
              )

              if not content.strip():
                  return ""
              return f'<g fill="{color}">{content}</g>'

          svg = re.sub(
              r'<g fill="([^"]+)">([\s\S]*?)</g>',
              clean_group,
              svg
          )

          remaining = len(pixels) - len(remove)
          if remaining != 1884:
              raise SystemExit(
                  f"Unexpected remaining pixel count: {remaining}"
              )

          if not svg.startswith("<svg"):
              raise SystemExit("Invalid SVG.")

          target.write_text(svg, encoding="utf-8")
          print(f"Background pixels removed: {len(remove)}")
          print(f"Remaining sprite pixels: {remaining}")
          print("DMG palette and transparent background prepared.")
          PY

      - name: Commit converted SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add sticky_DMG_64x64.svg
          git commit -m "Remove Sticky sprite background" || echo "No changes to commit"
          git push
