name: Sticky Sprite Render Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sticky-sprite-render-check.yml"
      - "references/sticky_no_tool_22x20.svg"
      - "references/sticky_no_tool_22x20_flipped.svg"
      - "references/sticky_tool_use_right_hand_22x20.svg"
      - "animations/sticky_idle_22x20.svg"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render and image tools
        run: python -m pip install --disable-pip-version-check cairosvg pillow

      - name: Render sprites and create pixel report
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import cairosvg
          from PIL import Image, ImageDraw

          files = {
              "no_tool": "references/sticky_no_tool_22x20.svg",
              "no_tool_flipped": "references/sticky_no_tool_22x20_flipped.svg",
              "tool_use": "references/sticky_tool_use_right_hand_22x20.svg",
              "idle": "animations/sticky_idle_22x20.svg",
          }
          out = Path("sprite-render-report")
          out.mkdir(exist_ok=True)
          report = {}

          for name, source in files.items():
              svg = Path(source)
              if not svg.exists():
                  raise SystemExit(f"Missing required sprite: {source}")
              png_path = out / f"{name}.png"
              cairosvg.svg2png(url=str(svg), write_to=str(png_path),
                               output_width=22, output_height=20)
              im = Image.open(png_path).convert("RGBA")
              alpha = im.getchannel("A")
              bbox = alpha.getbbox()
              occupied = sum(1 for a in alpha.getdata() if a > 0)
              edge = {
                  "left": any(alpha.getpixel((0, y)) > 0 for y in range(20)),
                  "right": any(alpha.getpixel((21, y)) > 0 for y in range(20)),
                  "top": any(alpha.getpixel((x, 0)) > 0 for x in range(22)),
                  "bottom": any(alpha.getpixel((x, 19)) > 0 for x in range(22)),
              }
              report[name] = {
                  "source": source,
                  "render_size": list(im.size),
                  "nontransparent_pixel_count": occupied,
                  "visible_bounds_xyxy": list(bbox) if bbox else None,
                  "touches_canvas_edge": edge,
                  "note": "Idle SVG is rendered as its initial/static SVG frame; animation frames are not sampled."
              }
              im.resize((220, 200), Image.Resampling.NEAREST).save(out / f"{name}_10x.png")

          # Sample all five discrete positions of the two SVG animations without
          # changing the repository source. Each animation is replaced only in-memory
          # by its corresponding static transform for the sampled frame.
          idle_source = Path(files["idle"]).read_text(encoding="utf-8")
          ns = "{http://www.w3.org/2000/svg}"
          idle_root = ET.fromstring(idle_source)
          anims = idle_root.findall(".//" + ns + "animateTransform")
          expected = [
              ("0 0", "0 0"),
              ("0 .5", "0 -.5"),
              ("0 0", "0 0"),
              ("0 -.5", "0 .5"),
              ("0 0", "0 0"),
          ]
          if len(anims) != 2:
              raise SystemExit(f"Expected exactly 2 animateTransform elements; found {len(anims)}")
          phase_images = []
          phase_report = []
          for idx, (body_value, hands_value) in enumerate(expected):
              root = ET.fromstring(idle_source)
              nodes = root.findall(".//" + ns + "animateTransform")
              for node, value in zip(nodes, (body_value, hands_value)):
                  parent = next(p for p in root.iter() if node in list(p))
                  parent.set("transform", "translate(" + value + ")")
                  parent.remove(node)
              svg_text = ET.tostring(root, encoding="unicode")
              png_path = out / f"idle_phase_{idx + 1}.png"
              cairosvg.svg2png(bytestring=svg_text.encode("utf-8"), write_to=str(png_path),
                               output_width=22, output_height=20)
              im = Image.open(png_path).convert("RGBA")
              im.resize((220, 200), Image.Resampling.NEAREST).save(out / f"idle_phase_{idx + 1}_10x.png")
              alpha = im.getchannel("A")
              bbox = alpha.getbbox()
              phase_report.append({
                  "phase": idx + 1,
                  "body_translate": body_value,
                  "hands_group_translate": hands_value,
                  "nontransparent_pixel_count": sum(1 for a in alpha.getdata() if a > 0),
                  "visible_bounds_xyxy": list(bbox) if bbox else None,
                  "touches_canvas_edge": {
                      "left": any(alpha.getpixel((0, y)) > 0 for y in range(20)),
                      "right": any(alpha.getpixel((21, y)) > 0 for y in range(20)),
                      "top": any(alpha.getpixel((x, 0)) > 0 for x in range(22)),
                      "bottom": any(alpha.getpixel((x, 19)) > 0 for x in range(22)),
                  }
              })
              phase_images.append(Image.open(out / f"idle_phase_{idx + 1}_10x.png").convert("RGBA"))
          phase_sheet = Image.new("RGBA", (220 * 5, 200), (32, 32, 32, 255))
          for idx, tile in enumerate(phase_images):
              phase_sheet.alpha_composite(tile, (idx * 220, 0))
          phase_sheet.convert("RGB").save(out / "idle-animation-5-phases.png")
          report["idle_animation_phases"] = phase_report
          (out / "pixel-report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))

          sheet = Image.new("RGBA", (22 * 10 * 2, 20 * 10 * 2), (32, 32, 32, 255))
          draw = ImageDraw.Draw(sheet)
          names = list(files)
          for i, name in enumerate(names):
              x = (i % 2) * 220
              y = (i // 2) * 200
              tile = Image.open(out / f"{name}_10x.png").convert("RGBA")
              sheet.alpha_composite(tile, (x, y))
              draw.text((x + 4, y + 4), name, fill=(255, 255, 255, 255),
                        stroke_width=1, stroke_fill=(0, 0, 0, 255))
          sheet.convert("RGB").save(out / "contact-sheet.png")
          PY

      - name: Upload render previews and report
        uses: actions/upload-artifact@v4
        with:
          name: sticky-sprite-render-report
          path: sprite-render-report/
          if-no-files-found: error
          retention-days: 14
