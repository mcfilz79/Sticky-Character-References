<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="640" viewBox="0 0 640 640" shape-rendering="crispEdges">
<title>Sticky – Gameplay Idle (share-1)</title>
<desc>Uses the corrected share-1.png sprite as its exact source. Transparent background, subtle vertical idle bob, 400 ms per pose, looping.</desc>
<image width="640" height="640" xlink:href="https://raw.githubusercontent.com/mcfilz79/Sticky-Character-References/main/share-1.png">
<animateTransform attributeName="transform" type="translate" values="0 0;0 32;0 0;0 -32;0 0;0 0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="2s" repeatCount="indefinite"/>
</image></svg>