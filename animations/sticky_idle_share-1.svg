<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="640" height="640" shape-rendering="crispEdges">
<title>Sticky – Gameplay Idle Animation</title>
<desc>Selbstständige SVG mit transparent eingebetteten Originalteilen aus share-1.png. Körper wippt subtil, Hände bewegen sich gegenläufig, Füße bleiben fest.</desc>
<g>
<image x="5" y="15" width="5" height="4" href="data:image/png;base64,"/>
<image x="11" y="14" width="5" height="4" href="data:image/png;base64,"/>
</g>
<g>
<image x="5" y="1" width="11" height="10" href="data:image/png;base64,"/>
<animateTransform attributeName="transform" type="translate" values="0 0;0 .5;0 0;0 -.5;0 0" dur="1.6s" repeatCount="indefinite" calcMode="discrete"/>
</g>
<g>
<image x="0" y="7" width="4" height="5" href="data:image/png;base64,"/>
<image x="17" y="8" width="3" height="4" href="data:image/png;base64,"/>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -.5;0 0;0 .5;0 0" dur="1.6s" repeatCount="indefinite" calcMode="discrete"/>
</g></svg>