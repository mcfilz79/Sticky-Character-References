<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 20" width="22" height="20" shape-rendering="crispEdges">
<title>Sticky – Front Reference (No Tool) – 22x20</title>
<desc>Static 22x20 pixel front-facing reference. Both arms are spaced outward for tool clearance. The two light lower head/body points remain connected, with a three-pixel gap between them. Feet are lowered by one pixel. No tool, no animation.</desc>
