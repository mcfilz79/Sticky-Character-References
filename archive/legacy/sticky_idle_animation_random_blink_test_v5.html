<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sticky – Augenlider Test v5</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101820;color:#e0f8d0;font-family:system-ui,sans-serif;padding:20px}main{width:min(92vw,440px);text-align:center}h1{font-size:1.2rem}p{color:#b8c9b0;line-height:1.45}.stage{width:min(78vw,320px);aspect-ratio:1;margin:20px auto;background:#c0c0c0;border:8px solid #506050;border-radius:12px;box-shadow:0 8px 0 #27382f;overflow:hidden}.stage img{width:100%;height:100%;image-rendering:pixelated}small{color:#9eae9b}</style></head><body><main><h1>Sticky – Augenlider Test v5</h1><p>Neue Lider werden nur als zusätzliche Pixel-Ebene eingeblendet. Die ursprünglichen Augen- und Körperpixel bleiben erhalten.</p><div class="stage"><img id="sticky" alt="Sticky in der Idle-Animation"></div><small>Testentwurf · additive Änderung</small></main><script>(()=>{const base="https://raw.githubusercontent.com/mcfilz79/Sticky-Character-References/main/";const open=["sticky_idle_frame_01_base.svg","sticky_idle_frame_02_body_down_arms_up.svg","sticky_idle_frame_03_body_up_arms_down.svg"];const shut=["sticky_idle_frame_01_blink_test_v5.svg","sticky_idle_frame_02_blink_test_v5.svg","sticky_idle_frame_03_blink_test_v5.svg"];let pose=0,blink=false;const img=document.getElementById("sticky");function draw(){img.src=base+(blink?shut[pose]:open[pose]);}draw();setInterval(()=>{pose=(pose+1)%3;draw();},400);function next(){setTimeout(()=>{blink=true;draw();setTimeout(()=>{blink=false;draw();next();},220);},3000+Math.random()*4000);}next();})();</script></body></html>
